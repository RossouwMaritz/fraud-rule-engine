server:
  max-http-request-header-size: ${FRAUD_MAX_REQUEST_HEADER_SIZE:8KB}
  # On SIGTERM, stop taking new requests and let in-flight ones finish, up to the timeout below.
  shutdown: graceful

spring:
  application:
    name: fraud-rule-engine
  lifecycle:
    # Below the orchestrator's kill deadline (compose stop_grace_period), so requests finish before a SIGKILL.
    timeout-per-shutdown-phase: ${FRAUD_SHUTDOWN_TIMEOUT:20s}
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: ${FRAUD_DB_POOL_SIZE:10}
      # Wait this long for a free connection, then 503. Milliseconds, as Hikari takes a plain number.
      connection-timeout: ${FRAUD_DB_CONNECTION_TIMEOUT_MS:2000}
      # Postgres cancels any statement that runs longer than this, and the API returns 503.
      connection-init-sql: SET statement_timeout = ${FRAUD_DB_STATEMENT_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

fraud:
  # Comma-separated, so a new key can be added before the old one is removed. At least 32 characters each.
  # FRAUD_API_KEY still works for a single key. No default, so the app won't start without one.
  api-keys: ${FRAUD_API_KEYS:${FRAUD_API_KEY:}}
  # Per API key and per app instance. Over the limit gets 429 with Retry-After.
  rate-limit:
    per-second: ${FRAUD_RATE_LIMIT_PER_SECOND:1000}
    burst: ${FRAUD_RATE_LIMIT_BURST:2000} # requests allowed at once after a quiet spell
  # Swagger UI and /v3/api-docs. Off by default; compose turns them on for local use.
  docs-enabled: ${FRAUD_DOCS_ENABLED:false}
  # A bigger body gets 413 before it is read. A transaction is well under 1KB.
  max-request-body: ${FRAUD_MAX_REQUEST_BODY:16KB}
  # An older occurredAt gets 400. Late events are still scored, against what happened on both sides of them.
  max-event-age: ${FRAUD_MAX_EVENT_AGE:45d}
  # How long a POST waits behind the same customer's other events before it gets 503.
  lock-timeout: ${FRAUD_LOCK_TIMEOUT:2s}
  api:
    clock-skew: ${FRAUD_CLOCK_SKEW:5m} # how far in the future occurredAt may be
    default-page-size: ${FRAUD_API_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${FRAUD_API_MAX_PAGE_SIZE:100} # at most 100, the hits batch size
  # Every value below is ${ENV_VAR:default}. The README lists them all.
  bands:
    review-from: ${FRAUD_REVIEW_FROM:40}
    high-risk-from: ${FRAUD_HIGH_RISK_FROM:80}
  rules:
    high-amount:
      enabled: ${FRAUD_HIGH_AMOUNT_ENABLED:true}
      score: ${FRAUD_HIGH_AMOUNT_SCORE:40}
      # Minor units of each currency. A currency not listed here always fires, so it gets a review.
      # Add another currency with FRAUD_RULES_HIGHAMOUNT_THRESHOLDSMINOR_<CODE>.
      thresholds-minor:
        ZAR: ${FRAUD_HIGH_AMOUNT_ZAR:5000000} # R50,000.00
        USD: ${FRAUD_HIGH_AMOUNT_USD:300000} # $3,000.00
        EUR: ${FRAUD_HIGH_AMOUNT_EUR:300000} # €3,000.00
        GBP: ${FRAUD_HIGH_AMOUNT_GBP:250000} # £2,500.00
    amount-anomaly:
      enabled: ${FRAUD_AMOUNT_ANOMALY_ENABLED:true}
      score: ${FRAUD_AMOUNT_ANOMALY_SCORE:50}
      min-history: ${FRAUD_AMOUNT_ANOMALY_MIN_HISTORY:10}
      lookback: ${FRAUD_AMOUNT_ANOMALY_LOOKBACK:30d}
      stddev-multiplier: ${FRAUD_AMOUNT_ANOMALY_STDDEV_MULTIPLIER:3}
      # The same merchant and amount one billing cycle back (rent, a debit order) is never an anomaly.
      # A quicker repeat doesn't count, so a fraudster can't clear a flagged amount by paying it twice.
      # Only CLEAN transactions count, for both the baseline and the repeat, so a flagged amount stays flagged.
      repeat-min-age: ${FRAUD_AMOUNT_ANOMALY_REPEAT_MIN_AGE:25d}
      repeat-max-age: ${FRAUD_AMOUNT_ANOMALY_REPEAT_MAX_AGE:35d} # spans a 31-day month
    velocity:
      enabled: ${FRAUD_VELOCITY_ENABLED:true}
      score: ${FRAUD_VELOCITY_SCORE:40}
      max-count: ${FRAUD_VELOCITY_MAX_COUNT:5}
      window: ${FRAUD_VELOCITY_WINDOW:10m}
    country-hop:
      enabled: ${FRAUD_COUNTRY_HOP_ENABLED:true}
      score: ${FRAUD_COUNTRY_HOP_SCORE:80}
      window: ${FRAUD_COUNTRY_HOP_WINDOW:2h}
    high-risk-category:
      enabled: ${FRAUD_HIGH_RISK_CATEGORY_ENABLED:true}
      score: ${FRAUD_HIGH_RISK_CATEGORY_SCORE:20}
      categories: ${FRAUD_HIGH_RISK_CATEGORIES:GAMBLING,CRYPTO,MONEY_TRANSFER}

springdoc:
  api-docs:
    enabled: ${fraud.docs-enabled}
  swagger-ui:
    enabled: ${fraud.docs-enabled}

logging:
  structured:
    format:
      console: ecs # JSON, and each request's lines carry its requestId

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081} # its own port, so health and metrics are never exposed with the API
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness takes a pod out of traffic when Postgres is down. Liveness leaves out db, so a database
        # outage doesn't restart every pod.
        readiness:
          include: readinessState,db
