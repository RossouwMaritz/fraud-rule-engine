spring:
  application:
    name: fraud-rule-engine
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

fraud:
  api-key: ${FRAUD_API_KEY} # no default, so the app won't start without it
  # An older occurredAt gets 400. Late events are still scored, against what happened on both sides of them.
  max-event-age: 45d
  bands:
    review-from: 40
    high-risk-from: 80
  rules:
    high-amount:
      enabled: true
      score: 40
      threshold-minor: 5000000 # R50,000.00
    amount-anomaly:
      enabled: true
      score: 50
      min-history: 10
      lookback: 30d
      stddev-multiplier: 3
      # The same merchant and amount one billing cycle back (rent, a debit order) is never an anomaly.
      # A quicker repeat doesn't count, so a fraudster can't clear a flagged amount by paying it twice.
      repeat-min-age: 25d
      repeat-max-age: 35d # spans a 31-day month
    velocity:
      enabled: true
      score: 40
      max-count: 5
      window: 10m
    country-hop:
      enabled: true
      score: 80
      window: 2h
    high-risk-category:
      enabled: true
      score: 20
      categories: [GAMBLING, CRYPTO, MONEY_TRANSFER]

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
