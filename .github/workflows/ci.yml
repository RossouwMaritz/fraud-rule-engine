name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Testcontainers uses the Docker that GitHub's Ubuntu runners already have.
      - run: ./mvnw -B verify
      - run: docker build -t fraud-rule-engine .
