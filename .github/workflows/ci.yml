name: CI

on:
  push:
  pull_request:

# Read-only token by default; a job that needs more asks for it.
permissions:
  contents: read

# A new push to a PR cancels its older run. Every other run gets its own group (head_ref is only set on PRs), so
# a quick series of pushes to main tests each commit instead of cancelling the waiting run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Actions are pinned by commit SHA, so a moved tag can't change what runs. Dependabot bumps them.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Testcontainers uses the Docker that GitHub's Ubuntu runners already have. JaCoCo fails this below its floor.
      - run: ./mvnw -B verify

  codeql:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2

  gitleaks:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Known example keys are listed in .gitleaksignore.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Trivy reads the POMs from ~/.m2; without them it fetches each one from Maven Central and gets rate limited.
      - run: ./mvnw -B -q dependency:resolve
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fraud-rule-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails only on HIGH/CRITICAL that have a fix, so the build isn't blocked on something nobody can act on yet.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fraud-rule-engine:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fraud-rule-engine:ci
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
      # The exact image that was scanned, for deploy-smoke and publish, so neither rebuilds it.
      - run: docker save fraud-rule-engine:ci -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  # Deploys the image with the k8s/ manifests to a throwaway kind cluster and runs the sample scenarios against it.
  deploy-smoke:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kind
      - run: kind load image-archive image.tar --name kind
      # Secrets stay out of git: fresh random ones for each run, as a real environment would get from its secret store.
      - name: Create secrets
        run: |
          owner=$(openssl rand -hex 16) app=$(openssl rand -hex 16) key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "FRAUD_API_KEY=$key" >> "$GITHUB_ENV"
          kubectl create secret generic postgres \
            --from-literal=POSTGRES_PASSWORD="$owner" --from-literal=POSTGRES_APP_PASSWORD="$app"
          kubectl create secret generic fraud-rule-engine \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$app" --from-literal=SPRING_FLYWAY_USER=fraud \
            --from-literal=SPRING_FLYWAY_PASSWORD="$owner" --from-literal=FRAUD_API_KEYS="$key"
          kubectl create configmap postgres-init --from-file=postgres/init-app-role.sh
      # The app may restart once or twice while Postgres starts; the rollout waits it out.
      - run: kubectl apply -k k8s/smoke
      - run: kubectl rollout status deploy/postgres --timeout=2m
      - run: kubectl rollout status deploy/fraud-rule-engine --timeout=5m
      - name: Run the sample scenarios through the Service
        run: |
          kubectl port-forward svc/fraud-rule-engine 8080:80 > port-forward.log 2>&1 &
          for _ in $(seq 30); do curl -s -o /dev/null localhost:8080 && break; sleep 1; done
          ./samples/send.sh
      - name: Show the cluster state
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deploy/fraud-rule-engine
          kubectl logs deploy/fraud-rule-engine --all-containers --tail=200 || true
          cat port-forward.log || true

  # Only main and v* tags, and only when every other job passed. Pushes the image deploy-smoke ran, then signs it.
  publish:
    needs: [codeql, gitleaks, trivy-fs, deploy-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign's keyless signing gets its certificate with the workflow's OIDC identity
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: docker load -i image.tar
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Push and sign
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag fraud-rule-engine:ci "$tag"
            docker push "$tag"
          done
          # Sign the digest, not a tag, so the signature can't move to another image.
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' fraud-rule-engine:ci)
          cosign sign --yes "$digest"
          echo "Published and signed $digest" >> "$GITHUB_STEP_SUMMARY"
